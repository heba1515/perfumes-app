<div class="sort-wrapper">
  <div class="results-summary">
    <span class="summary-rule" aria-hidden="true"></span>
    <span class="count-label">{{ totalCount() }} Fragrances available</span>
  </div>

  <label class="select-container" for="product-sort-select">
    <span class="sort-label">Sort by</span>
    <span class="select-field">
      <select id="product-sort-select" [value]="selectedSort()" (change)="onChange($event)" class="sort-select">
        <option value="featured">Featured</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="rating">Highest Rated</option>
      </select>
    </span>
  </label>
</div>
