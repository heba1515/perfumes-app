<aside class="filters-sidebar">
  <div class="filters-header">
    <h4 class="filters-title">Filter</h4>
    <button type="button" class="reset-btn" (click)="resetFilters.emit()">Reset</button>
  </div>

  <div class="filter-block">
    <h4 class="group-title">Category</h4>
    <div class="category-list">
      @for (cat of categories; track cat.id) {
      <label class="checkbox-label" [class.checked]="selectedCategory() === cat.id">
        <input
          type="checkbox"
          class="checkbox-input"
          [checked]="selectedCategory() === cat.id"
          (change)="selectCategory(cat.id)"
        />
        <span>{{ cat.label }}</span>
      </label>
      }
    </div>
  </div>

  <div class="sidebar-divider"></div>

  <div class="filter-block">
    <h4 class="group-title">Scent Family</h4>
    <div class="category-list">
      @for (scent of scentFamilyList; track scent) {
      <label class="checkbox-label" [class.checked]="isScentSelected(scent)">
        <input
          type="checkbox"
          class="checkbox-input"
          [checked]="isScentSelected(scent)"
          (change)="toggleScent(scent)"
        />
        <span>{{ scent }}</span>
      </label>
      }
    </div>
  </div>

  <div class="sidebar-divider"></div>

  <div class="filter-block">
    <h4 class="group-title">Occasion</h4>
    <div class="category-list">
      @for (occasion of occasionList; track occasion) {
      <label class="checkbox-label" [class.checked]="isOccasionSelected(occasion)">
        <input
          type="checkbox"
          class="checkbox-input"
          [checked]="isOccasionSelected(occasion)"
          (change)="toggleOccasion(occasion)"
        />
        <span>{{ occasion }}</span>
      </label>
      }
    </div>
  </div>

  <div class="sidebar-divider"></div>

  <div class="filter-block price-filter-block">
    <h4 class="group-title">Price Range</h4>
    <div class="price-range-inputs">
      <label class="price-input-wrapper">
        <span class="price-input-label">Min</span>
        <input
          type="number"
          min="0"
          step="5"
          [value]="minPrice()"
          placeholder="0"
          class="price-input"
          (input)="onMinPriceChange($event)"
        />
      </label>
      <span class="price-range-separator">—</span>
      <label class="price-input-wrapper">
        <span class="price-input-label">Max</span>
        <input
          type="number"
          min="0"
          step="5"
          [value]="maxPrice()"
          placeholder="500"
          class="price-input"
          (input)="onMaxPriceChange($event)"
        />
      </label>
    </div>
  </div>

  <div class="sidebar-divider"></div>

  <div class="filter-block">
    <label class="checkbox-label" [class.checked]="inStockOnly()">
      <input
        type="checkbox"
        class="checkbox-input"
        [checked]="inStockOnly()"
        (change)="toggleInStock($event)"
      />
      <span>In Stock Only</span>
    </label>
  </div>
</aside>
