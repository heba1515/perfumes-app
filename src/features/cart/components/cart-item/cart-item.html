<div class="cart-item-row">
  <div class="item-visual">
    @if (item().imageUrl) {
    <img [src]="item().imageUrl" [alt]="item().name" class="thumbnail" />
    } @else {
    <div class="placeholder-icon" aria-hidden="true">◌</div>
    }
  </div>

  <div class="item-main">
    <div class="item-details">
      <a [routerLink]="['/products', item().productId]" class="item-name">
        {{ item().name }}
      </a>
      @if (item().description || item().selectedOption) {
      <div class="item-meta">
        <span class="item-option">{{ item().description ?? item().selectedOption }}</span>
        @if (item().selectedOption) {
        <span class="item-size">{{ item().selectedOption }}</span>
        }
      </div>
      }
    </div>

    <div class="quantity-controls" aria-label="Quantity">
      <button type="button" class="qty-btn" (click)="onQuantityChange(-1)" [disabled]="item().quantity <= 1"
        aria-label="Decrease quantity">
        −
      </button>
      <span class="qty-count">{{ item().quantity }}</span>
      <button type="button" class="qty-btn" (click)="onQuantityChange(1)" aria-label="Increase quantity">
        +
      </button>
    </div>
  </div>

  <div class="price-remove">
    <span class="line-total">{{ lineTotal() }}</span>
    <button type="button" class="remove-btn" (click)="onRemove()"
      [attr.aria-label]="'Remove ' + item().name + ' from cart'">
      Remove
    </button>
  </div>
</div>
